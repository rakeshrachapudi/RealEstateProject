# Scheduler Configuration
# ------------------------------------------------------------------------------
# Cron expression for notification scheduler
# Default: 0 0 */6 * * * = Every 6 hours at minute 0
#
# Common patterns:
# Every hour:             0 0 * * * *
# Every 2 hours:          0 0 */2 * * *
# Every 6 hours:          0 0 */6 * * *  (Default)
# Every 12 hours:         0 0 */12 * * *
# Daily at 9 AM:          0 0 9 * * *
# Twice daily (9 & 18):   0 0 9,18 * * *
# Every 30 minutes:       0 */30 * * * *
# Business hours only:    0 0 9-17 * * MON-FRI
#notification.scheduler.cron=0 0 */6 * * *

# Every 5 minutes:
notification.scheduler.cron=0 */5 * * * *


# Notification Batch Settings
# ------------------------------------------------------------------------------
# Maximum number of properties to include in a single email
# If buyer viewed more than this, only first N will be shown
notification.batch.maxPropertiesPerEmail=3
